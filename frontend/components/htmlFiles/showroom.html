<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ChuksTech | Project Showroom — Immersive Portfolio</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.11/typed.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Custom cursor — polished */
    .cursor {
      width: 24px;
      height: 24px;
      border: 2px solid #F39905;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.2s ease, width 0.2s, height 0.2s;
      transform: translate(-50%, -50%);
      backdrop-filter: invert(0.1);
    }
    .cursor-dot {
      width: 6px;
      height: 6px;
      background: #F39905;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: 0.1s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #171c30 0%, #1f2642 50%, #F39905 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* Smooth scroll behaviour */
    html {
      scroll-behavior: smooth;
    }

    /* Modern Navbar - glass morphism enhanced */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(23, 28, 48, 0.7);
      backdrop-filter: blur(14px);
      z-index: 1000;
      padding: 1rem 2rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border-bottom: 1px solid rgba(243, 153, 5, 0.2);
    }
    .navbar.scrolled {
      background: rgba(10, 12, 28, 0.85);
      backdrop-filter: blur(16px);
      padding: 0.7rem 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      border-bottom-color: #F39905;
    }
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #F39905);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .logo span {
      background: none;
      -webkit-text-fill-color: #F39905;
    }

    /* Search container — refined */
    .search-container {
      position: relative;
      width: 320px;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      font-weight: 400;
    }
    .search-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      border-color: #F39905;
      box-shadow: 0 0 0 3px rgba(243, 153, 5, 0.3);
    }
    .search-input::placeholder {
      color: rgba(255,255,240,0.7);
    }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #F39905;
      font-size: 1rem;
    }

    /* Hero section — dynamic & modern */
    .hero {
      text-align: center;
      padding: 140px 24px 70px;
      background: radial-gradient(circle at 10% 30%, rgba(243,153,5,0.2), rgba(23,28,48,0.9));
      border-bottom: 1px solid rgba(243,153,5,0.3);
    }
    .hero h1 {
      font-size: 3.7rem;
      font-weight: 800;
      background: linear-gradient(to right, #fff, #F39905);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      animation: fadeInUp 0.7s ease;
      margin-top: 20px;
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 650px;
      margin: 0 auto;
      opacity: 0.9;
      animation: fadeInUp 0.7s ease 0.15s both;
    }
    .typed-text {
      font-size: 1.5rem;
      margin-top: 1.2rem;
      font-weight: 600;
      color: #F39905;
      background: rgba(0,0,0,0.3);
      display: inline-block;
      padding: 0.3rem 1.5rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      animation: fadeInUp 0.7s ease 0.3s both;
    }

    /* Stats bar - glass cards */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
      animation: fadeInUp 0.7s ease 0.45s both;
    }
    .stat-item {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      border: 1px solid rgba(243,153,5,0.4);
      transition: transform 0.2s;
    }
    .stat-item:hover {
      transform: translateY(-5px);
      background: rgba(243,153,5,0.15);
    }
    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #F39905;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.85rem;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    /* Projects Grid — modern masonry feel */
    .projects-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }

    /* Project Card — elegant glassmorphism */
    .project-card {
      background: rgba(20, 25, 45, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }
    .project-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(243, 153, 5, 0.6);
      background: rgba(30, 35, 58, 0.75);
    }
    .project-image {
      position: relative;
      overflow: hidden;
      height: 240px;
    }
    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .project-card:hover .project-image img {
      transform: scale(1.08);
    }
    .project-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .project-card:hover .project-overlay {
      opacity: 1;
    }
    .project-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #F39905;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      z-index: 2;
      color: #171c30;
    }
    .project-info {
      padding: 1.5rem;
    }
    .project-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.3px;
    }
    .tech-stack {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.8rem 0 1rem;
    }
    .tech-badge {
      background: rgba(243, 153, 5, 0.2);
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      backdrop-filter: blur(2px);
    }
    .project-stats {
      display: flex;
      gap: 1.5rem;
      margin: 1rem 0;
      padding: 0.7rem 0;
      border-top: 1px solid rgba(255,255,255,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .stat i {
      color: #F39905;
      font-size: 1rem;
    }
    .like-btn {
      cursor: pointer;
      transition: all 0.2s;
    }
    .like-btn:hover {
      transform: scale(1.05);
    }

    /* Buttons refined */
    .project-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.2rem;
    }
    .btn {
      flex: 1;
      padding: 0.8rem 0.5rem;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.12);
      color: white;
    }
    .btn-primary {
      background: linear-gradient(105deg, #F39905, #e67e22);
      color: #fff;
      box-shadow: 0 4px 10px rgba(243,153,5,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(243,153,5,0.4);
      background: linear-gradient(105deg, #ffaa22, #F39905);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(243,153,5,0.5);
    }
    .btn-secondary:hover {
      background: rgba(243,153,5,0.3);
      transform: translateY(-2px);
    }

    /* Gallery Modal — full upgrade */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.96);
      z-index: 2000;
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      position: relative;
      width: 90%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(243,153,5,0.5);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      font-size: 1.8rem;
      color: white;
      cursor: pointer;
      z-index: 20;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      transition: 0.2s;
    }
    .close-btn:hover {
      background: #F39905;
      transform: rotate(90deg);
    }
    .gallery-container {
      position: relative;
      overflow: hidden;
      height: 55vh;
      background: #0a0c14;
    }
    .gallery-slides {
      display: flex;
      transition: transform 0.4s ease-out;
      height: 100%;
    }
    .slide {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1f2e;
    }
    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }
    .slide-caption {
      position: absolute;
      bottom: 0.8rem;
      left: 0;
      right: 0;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 0.5rem;
      font-size: 0.85rem;
    }
    .gallery-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(0,0,0,0.6);
    }
    .gallery-controls button {
      background: rgba(255,255,255,0.15);
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .gallery-controls button:hover {
      background: #F39905;
      transform: translateY(-2px);
    }
    .indicators {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.6rem;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: 0.2s;
    }
    .indicator.active {
      background: #F39905;
      transform: scale(1.3);
    }
    .thumbnails {
      display: flex;
      gap: 0.6rem;
      padding: 0.8rem;
      overflow-x: auto;
      background: rgba(0,0,0,0.7);
    }
    .thumbnail {
      width: 80px;
      height: 60px;
      cursor: pointer;
      opacity: 0.6;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: 0.2s;
    }
    .thumbnail.active {
      opacity: 1;
      border-color: #F39905;
      transform: scale(1.02);
    }
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .no-results {
      text-align: center;
      padding: 4rem;
      font-size: 1.2rem;
      background: rgba(0,0,0,0.3);
      border-radius: 60px;
      grid-column: 1/-1;
    }
    .footer {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      text-align: center;
      padding: 2rem;
      margin-top: 2rem;
      font-size: 0.9rem;
    }

    /* animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(35px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heartBeat {
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.25); }
    }
    .heart-beat {
      animation: heartBeat 0.35s ease;
    }

    /* Responsiveness */
    @media (max-width: 880px) {
      .hero h1 { font-size: 2.4rem; }
      .projects-grid { grid-template-columns: 1fr; padding: 2rem 1.2rem; gap: 1.6rem; }
      .stats-bar { gap: 1rem; }
      .stat-item { padding: 0.5rem 1.2rem; }
      .stat-number { font-size: 1.6rem; }
      .search-container { width: 100%; }
      .nav-container { flex-direction: column; align-items: stretch; text-align: center; }
      .navbar { padding: 1rem; }
      .project-actions { flex-direction: column; gap: 0.7rem; }
      .gallery-container { height: 45vh; }
      .thumbnail { width: 60px; height: 45px; }
      .cursor, .cursor-dot { display: none; } /* better mobile UX */
    }
    @media (max-width: 520px) {
      .hero {
         padding: 110px 16px 50px; 
        }
        .hero h1 {
          font-size: 26px;
        }
        .logo { font-size: 1.6rem; }
      .typed-text { font-size: 1.1rem; }
      .project-title { font-size: 1.3rem; }
    }
    /* custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #171c30; }
    ::-webkit-scrollbar-thumb { background: #F39905; border-radius: 10px; }
  </style>
</head>

    title: 'Word Puzzy Game Gallery',
    images: [
      { src: '/frontend/images/word puzzy/a developer portfoli.png', caption: 'Light and dark theme' },
      { src: '/frontend/images/word puzzy/Word Puzzle Game - Personal - Microsoft​ Edge 12_3_2025 4_00_13 PM.png', caption: 'Igbo Language Section' },
      { src: '/frontend/images/word puzzy/level selection.png', caption: 'Level Selection Page' },
      { src: '/frontend/images/word puzzy/Word Puzzle Game and 1 more page - Personal - Microsoft​ Edge 12_3_2025 3_40_16 PM.png', caption: 'Refill heart page' },
      { src: '/frontend/images/word puzzy/Word Puzzle Game - Personal - Microsoft​ Edge 12_3_2025 5_20_46 PM.png', caption: 'Game Play Page' }
    ]
  },
  'chuks AI': {
    title: 'chuks AI Gallery',
    images: [
      { src: '/frontend/images/video-ai/homepage.png', caption: 'Homepage' },
      { src: '/frontend/images/video-ai/frequently ask questions page.png', caption: 'Frequently ask questions page' },
      { src: '/frontend/images/video-ai/price page.png', caption: 'Price list Page' },
      { src: '/frontend/images/video-ai/review page.png', caption: 'Review page' },
      { src: '/frontend/images/video-ai/footer 1.png', caption: 'Navigation page' }
    ]
  }
};
    // extend fallback: fill minimal missing images to avoid emptiness
    for(let key in projectGalleries) {
      if(projectGalleries[key].images.length === 0) projectGalleries[key].images = [{ src: 'https://via.placeholder.com/800x450?text=Preview+Ready', caption: 'Gallery preview' }];
    }

    let projectStats = {};
    let likedProjects = JSON.parse(localStorage.getItem('likedProjects') || '{}');
    let currentSlide = 0, slideInterval, currentGalleryImages = [], isPlaying = true, currentGalleryId = null;

    function getBaseURL() { return (location.hostname === 'localhost') ? 'http://localhost:5000' : 'https://my-portfolio-message-api-naci.onrender.com'; }
    async function getVisitorIP() { try { let r=await fetch('https://api.ipify.org?format=json'); let d=await r.json(); return d.ip; } catch(e){ return null; } }
    async function trackView(projectId, projectName) { try { let ip=await getVisitorIP(); await fetch(`${getBaseURL()}/api/stats/track-view`,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ projectId, projectName, visitorIp:ip }) }); loadProjectStats(); } catch(e){} }
    async function trackLike(projectId, el) { if(likedProjects[projectId]) { showAlert('Already liked! ❤️'); return; } try { let r=await fetch(`${getBaseURL()}/api/stats/track-like`,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ projectId }) }); let d=await r.json(); if(d.success){ likedProjects[projectId]=true; localStorage.setItem('likedProjects',JSON.stringify(likedProjects)); if(el) el.classList.add('heart-beat'); loadProjectStats(); showAlert('❤️ Thank you for loving this project!'); } } catch(e){} }
    async function loadProjectStats() { try { let r=await fetch(`${getBaseURL()}/api/stats/all-stats`); let d=await r.json(); if(d.success){ projectStats={}; d.stats.forEach(s=>{ projectStats[s.projectId]={ views:s.views, likes:s.likes }; }); updateUI(); renderProjects(document.getElementById('searchInput')?.value||''); } } catch(e){} }
    function updateUI(){ let totalViews=0,totalLikes=0; Object.values(projectStats).forEach(s=>{ totalViews+=s.views; totalLikes+=s.likes; }); document.getElementById('totalProjects').innerText=projects.length; document.getElementById('totalViews').innerText=totalViews.toLocaleString(); document.getElementById('totalLikes').innerText=totalLikes.toLocaleString(); }

    function showAlert(msg){ alert(msg); } // fallback

    // Gallery methods
    function openGallery(galleryId){ if(projectGalleries[galleryId]){ currentGalleryImages=projectGalleries[galleryId].images; currentSlide=0; initGalleryModal(); document.getElementById('gallery-modal').style.display='flex'; document.body.style.overflow='hidden'; startSlideShow(); } else { showAlert('📸 Gallery assets being prepared. Stay tuned!'); } }
    function closeModal(){ let modal=document.getElementById('gallery-modal'); if(modal){ modal.style.display='none'; document.body.style.overflow='auto'; if(slideInterval) clearInterval(slideInterval); } }
    function initGalleryModal(){ let slidesContainer=document.querySelector('.gallery-slides'), indicators=document.querySelector('.indicators'), thumbnails=document.querySelector('.thumbnails'); if(!slidesContainer) return; slidesContainer.innerHTML=''; indicators.innerHTML=''; thumbnails.innerHTML=''; currentGalleryImages.forEach((img,i)=>{ let slide=document.createElement('div'); slide.className='slide'; slide.innerHTML=`<img src="${img.src}" alt="${img.caption}" onerror="this.src='https://via.placeholder.com/800x400?text=Image+Not+Found'"><div class="slide-caption">${img.caption}</div>`; slidesContainer.appendChild(slide); let ind=document.createElement('div'); ind.className='indicator'; if(i===0) ind.classList.add('active'); ind.addEventListener('click',()=>goToSlide(i)); indicators.appendChild(ind); let thumb=document.createElement('div'); thumb.className='thumbnail'; if(i===0) thumb.classList.add('active'); thumb.innerHTML=`<img src="${img.src}" onerror="this.src='https://via.placeholder.com/80x60'">`; thumb.addEventListener('click',()=>goToSlide(i)); thumbnails.appendChild(thumb); }); updateGallery(); }
    function goToSlide(index){ currentSlide=index; updateGallery(); }
    function nextSlide(){ if(currentGalleryImages.length) currentSlide=(currentSlide+1)%currentGalleryImages.length; updateGallery(); }
    function prevSlide(){ if(currentGalleryImages.length) currentSlide=(currentSlide-1+currentGalleryImages.length)%currentGalleryImages.length; updateGallery(); }
    function updateGallery(){ let slides=document.querySelector('.gallery-slides'); if(slides) slides.style.transform=`translateX(-${currentSlide*100}%)`; document.querySelectorAll('.indicator').forEach((el,i)=>el.classList.toggle('active',i===currentSlide)); document.querySelectorAll('.thumbnail').forEach((el,i)=>el.classList.toggle('active',i===currentSlide)); }
    function startSlideShow(){ if(slideInterval) clearInterval(slideInterval); slideInterval=setInterval(()=>{ nextSlide(); },4000); isPlaying=true; let btn=document.querySelector('.btn-play-pause'); if(btn) btn.innerHTML='<i class="fas fa-pause"></i>'; }
    function stopSlideShow(){ if(slideInterval){ clearInterval(slideInterval); slideInterval=null; } isPlaying=false; let btn=document.querySelector('.btn-play-pause'); if(btn) btn.innerHTML='<i class="fas fa-play"></i>'; }
    function togglePlayPause(){ isPlaying? stopSlideShow(): startSlideShow(); }

    function renderProjects(search=''){ let filtered=projects.filter(p=> p.name.toLowerCase().includes(search.toLowerCase())||p.title.toLowerCase().includes(search.toLowerCase())||p.description.toLowerCase().includes(search.toLowerCase())); let grid=document.getElementById('projectsGrid'); if(filtered.length===0){ grid.innerHTML='<div class="no-results"><i class="fas fa-search"></i><p>No projects match — try another keyword</p></div>'; return; } grid.innerHTML=filtered.map(p=>`<div class="project-card" data-project-id="${p.id}"><div class="project-image"><img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x250?text=Preview'"><div class="project-overlay">${p.comingSoon?'<div class="project-badge">Coming Soon</div>':''}</div></div><div class="project-info"><div class="project-title">${p.title}</div><p style="opacity:0.85; margin-bottom:0.6rem;">${p.description}</p><div class="tech-stack">${p.techStack.map(t=>`<span class="tech-badge">${t}</span>`).join('')}</div><div class="project-stats"><div class="stat"><i class="fas fa-eye"></i><span class="view-count">${projectStats[p.id]?.views||0}</span><span>views</span></div><div class="stat like-btn" data-like-project="${p.id}"><i class="fas fa-heart" style="color:${likedProjects[p.id]?'#ff6b6b':'#F39905'}"></i><span class="like-count">${projectStats[p.id]?.likes||0}</span><span>likes</span></div></div><div class="project-actions"><button class="btn btn-primary view-project" data-url="${p.url}" data-id="${p.id}" data-name="${p.name}" ${p.comingSoon?'disabled':''}><i class="fas fa-external-link-alt"></i> ${p.comingSoon?'Coming Soon':'View Project'}</button><button class="btn btn-secondary gallery-open" data-gallery="${p.gallery}"><i class="fas fa-images"></i> Gallery</button></div></div></div>`).join(''); attachEvents(); }
    function attachEvents(){ document.querySelectorAll('.view-project').forEach(btn=>{ btn.addEventListener('click',async(e)=>{ let url=btn.dataset.url, id=btn.dataset.id, name=btn.dataset.name; if(url==='#'){ showAlert(' Launching soon!'); return; } await trackView(id,name); window.open(url,'_blank'); }); }); document.querySelectorAll('.like-btn').forEach(btn=>{ btn.addEventListener('click',async(e)=>{ e.stopPropagation(); let pid=btn.dataset.likeProject; await trackLike(pid,btn); }); }); document.querySelectorAll('.gallery-open').forEach(btn=>{ btn.addEventListener('click',(e)=>{ e.preventDefault(); let gid=btn.dataset.gallery; openGallery(gid); }); }); }

    document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('currentYear').innerText=new Date().getFullYear(); new Typed(".typing",{ strings:[" Explore my creative journey"," Amazing Projects"," Innovation meets design"," Let's build something great"], typeSpeed:45, backSpeed:30, loop:true }); window.addEventListener('scroll',()=>{ document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>50); }); document.querySelector('.close-btn')?.addEventListener('click',closeModal); document.querySelector('.btn-prev')?.addEventListener('click',prevSlide); document.querySelector('.btn-next')?.addEventListener('click',nextSlide); document.querySelector('.btn-play-pause')?.addEventListener('click',togglePlayPause); document.getElementById('gallery-modal')?.addEventListener('click',(e)=>{ if(e.target===document.getElementById('gallery-modal')) closeModal(); }); document.getElementById('searchInput').addEventListener('input',(e)=>{ renderProjects(e.target.value); }); loadProjectStats().then(()=>renderProjects()); });

    // custom cursor hide on mobile, fine on desktop
    if(window.matchMedia("(max-width: 880px)").matches){ document.querySelector('.cursor')?.remove(); document.querySelector('.cursor-dot')?.remove(); } else { document.addEventListener('mousemove',(e)=>{ let cur=document.querySelector('.cursor'), dot=document.querySelector('.cursor-dot'); if(cur){ cur.style.transform=`translate(${e.clientX-12}px, ${e.clientY-12}px)`; } if(dot) dot.style.transform=`translate(${e.clientX-3}px, ${e.clientY-3}px)`; }); document.querySelectorAll('a,button,.project-card').forEach(el=>{ el.addEventListener('mouseenter',()=>{ let cur=document.querySelector('.cursor'); if(cur) cur.style.transform+=' scale(1.4)'; }); el.addEventListener('mouseleave',()=>{ let cur=document.querySelector('.cursor'); if(cur) cur.style.transform=cur.style.transform.replace(' scale(1.4)',''); }); }); }
  </script>
</body>
</html>
