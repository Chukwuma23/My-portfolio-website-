
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <title>Project Gallery with Slideshow</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.11/typed.min.js"></script>
    <link rel="stylesheet" href="/frontend/components/styles/showroom.css">
      <!-- Using Tailwind CSS via CDN for development -->
    <script src="https://cdn.tailwindcss.com"></script>
   <link rel="icon" type="image/png" href="/frontend/images/chuksicon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
</head>
<body>
       <div class="banner flex items-center justify-between bg-yellow-500 w-full p-2 absolute top-0 left-0">
        <h3 class="text-white text-lg ml-5">My Project Gallery</h3>
        <div class="search flex items-center justify-between bg-white rounded-full p-1 ">
    <input className="bg-transparent outline-none px-2 w-full" type="text" placeholder="Search">
    <svg className="relative top-0 left-2" xmlns="http://www.w3.org/2000/svg"
   width="20"
    height="20"
     viewBox="0 0 24 24"
     stroke="gray">
    <path
     d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91
      16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99
       5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
    />
  </svg>
    </div>
</div>
 <div class="container mt-40 mb-40">
        <h1>Projects Gallery</h1>
        
        <div id="image-container">
            <!-- Project 1 -->
            <div class="project-card">
                <h2>Blog Website</h2>
                <img src="/frontend/images/blogImages/Chuks Blog App 10_23_2025 2_20_51 PM.png" alt="Blog Website">
                <div class="card-footer">
                    <a class="btn" href="https://chuksblogapp.netlify.app/">
                        <i class="fas fa-eye"></i> View Project
                    </a>
                    <button class="gallery-btn" data-project="blog">
                        <i class="fas fa-images"></i>
                    </button>
                </div>
            </div>

            <!-- Project 2 -->
            <div class="project-card">
                <h2>Portfolio Website</h2>
                <img src="https://images.unsplash.com/photo-1467232004584-a241de8bcf5d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Portfolio Website">
                <div class="card-footer">
                    <a class="btn" href="./my showroom /htmlFiles/portfolio.html">
                        <i class="fas fa-eye"></i> View Project
                    </a>
                    <button class="gallery-btn" data-project="Payment Tracker">
                        <i class="fas fa-images"></i>
                    </button>
                </div>
            </div>

            <!-- Project 3 -->
            <div class="project-card">
                <h2>Word Game</h2>
                <img src="https://images.unsplash.com/photo-1553484771-8e94869b4c6a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Word Game">
                <div class="card-footer">
                    <button class="btn" onclick="alert('Project not available at the moment check again later.\n Thank you.')">
                        <i class="fas fa-eye"></i> View Project
                    </button>
                    <button class="gallery-btn" data-project="word-game">
                        <i class="fas fa-images"></i>
                    </button>
                </div>
            </div>

            <!-- Project 4 -->
            <div class="project-card">
                <h2>E-commerce App</h2>
                <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="E-commerce App">
                <div class="card-footer">
                    <button class="btn" onclick="alert('Project not available at the moment check again later.\n Thank you.')">
                        <i class="fas fa-eye"></i> View Project
                    </button>
                    <button class="gallery-btn" data-project="ecommerce">
                        <i class="fas fa-images"></i>
                    </button>
                </div>
            </div>
        </div>
   

    <!-- Modal for Gallery -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="gallery-container">
                <div class="gallery-slides">
                    <!-- Slides will be inserted by JavaScript -->
                </div>
            </div>
            
            <div class="gallery-controls">
                <button class="gallery-btn btn-prev">Previous</button>
                <button class="gallery-btn btn-play-pause">❚❚</button>
                <button class="gallery-btn btn-next">Next</button>
            </div>
            
            <div class="indicators">
                <!-- Indicators will be inserted by JavaScript -->
            </div>
            
            <div class="thumbnails">
                <!-- Thumbnails will be inserted by JavaScript -->
            </div>
        </div>
    </div>
 </div>
   <footer class="footer mt-auto py-3  bg-black w-full text-center text-white text-sm">
        <span>Copyright © <script>
                document.write(new Date().getFullYear());
            </script> All rights reserved By <i class="fa fa-heart"></i> <a class="text-yellow-500" href="https://m.facebook.com/dark.r34">CHUKWUMA KALU</a></p>
    </footer>

 <script src="/frontend/components/scirpts/showroom.js"></script>
</body>
</html>
