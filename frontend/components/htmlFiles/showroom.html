            <!-- Project 5 -->

    <!-- Modal for Gallery -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="gallery-container">
                <div class="gallery-slides">
                    <!-- Slides will be inserted by JavaScript -->
                </div>
            </div>
            
            <div class="gallery-controls">
                <button class="gallery-btn btn-prev">Previous</button>
                <button class="gallery-btn btn-play-pause">❚❚</button>
                <button class="gallery-btn btn-next">Next</button>
            </div>
            
            <div class="indicators">
                <!-- Indicators will be inserted by JavaScript -->
            </div>
            
            <div class="thumbnails">
                <!-- Thumbnails will be inserted by JavaScript -->
            </div>
        </div>
    </div>
